name: Continuous Integration & Automated Edge Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Code Quality, Escapes Audit & Automated Triad Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit Escape Characters & Scaffolding Purity
        run: |
          echo "Auditing for forbidden escape characters..."
          if grep -rn $'\t' src/; then
            echo "FAILED: Tab escape characters detected in src/"
            exit 1
          fi
          echo "Escape character audit passed."

      - name: Execute Full Triad Regression Test Suite
        run: |
          node test/unit/test_ports_lifecycle_and_store.js
          node test/unit/test_sanitizer_url_and_storage.js
          node test/unit/test_time_engine_and_milestones.js
          node test/unit/test_gemini_ai_and_heuristics.js
          node test/unit/test_canvas_renderer_and_layout.js
          node test/unit/test_design_tokens_and_themes.js
          node test/unit/test_sensory_immersion_and_audio.js
          node test/unit/test_app_controller_and_wiring.js
          node test/unit/test_pwa_serviceworker_and_ci.js
          node test/unit/test_mathematical_and_system_invariants.js
          node test/soak/test_soak_10000_frames.js
          node test/e2e/test_lighthouse_audit.js

  deploy-to-edge:
    name: Deploy to GitHub Pages Edge CDN
    needs: validate-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Static Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './'

      - name: Deploy to Fastly Edge CDN
        id: deployment
        uses: actions/deploy-pages@v4
